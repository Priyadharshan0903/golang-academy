# Leader election uses a Lease object in the operator's own namespace,
# so only that namespace needs these permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shortlink-operator-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shortlink-operator-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shortlink-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: shortlink-operator
