---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shortlink-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - shortener.example.com
  resources:
  - shortlinks
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shortener.example.com
  resources:
  - shortlinks/finalizers
  verbs:
  - update
- apiGroups:
  - shortener.example.com
  resources:
  - shortlinks/status
  verbs:
  - get
  - patch
  - update
