apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never go below the desired number of ready pods
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortener
    spec:
      # Longer than SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT, so the kubelet never
      # has to SIGKILL a pod that is still finishing requests.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shortener
          image: shortener:dev
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: BASE_URL
              value: http://shortener.localtest.me
            - name: LOG_LEVEL
              value: info
            # Keep serving, unready, while endpoints are updated (lesson 12.8).
            - name: SHUTDOWN_DELAY
              value: 5s
            - name: SHUTDOWN_TIMEOUT
              value: 20s
            # Rate limits must key on the client, not on the ingress pod.
            - name: CLIENT_IP_HEADER
              value: X-Real-Ip
            # About 90% of the memory limit below (lesson 11.3).
            - name: GOMEMLIMIT
              value: 115MiB
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"       # Go 1.25+ sets GOMAXPROCS from this (lesson 11.1)
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
