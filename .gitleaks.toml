title = "Go by Doing publication checks"

[extend]
useDefault = true

# Embedded go.sum lines are module integrity hashes. Match only the complete
# checksum syntax; keep every other string in curriculum JSON subject to scans.
[[allowlists]]
description = "Go module h1 checksums misidentified as generic API keys"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^(?:oauth2|api|apimachinery|apiextensions-apiserver|apiserver)\s+v[0-9][0-9A-Za-z.+-]*\s+h1:[A-Za-z0-9+/]{43}=(?:\\n|\r?\n|$)''']
