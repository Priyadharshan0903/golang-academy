name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan publication files and learner ZIPs
        run: python3 scripts/security/check-secrets.py --stage "$RUNNER_TEMP/publication-scan"
      - name: Install verified Gitleaks release
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan Git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all"
          --config .gitleaks.toml --redact=100 --no-banner --ignore-gitleaks-allow
      - name: Scan current files and archives
        run: >-
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/publication-scan"
          --config .gitleaks.toml --redact=100 --no-banner
          --max-archive-depth 1 --ignore-gitleaks-allow

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Audit application dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Audit development and build dependencies
        # Keep unresolved tooling advisories visible as a failing check.
        run: npm audit --package-lock-only --audit-level=high
